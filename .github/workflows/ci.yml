# RENDERED by `cargo xtask fleet render busbar-transport-ws` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. The CI itself is
# busbar's plugin-ci.yml, taken at the busbar commit this repo pins (.busbar-ref).
name: ci

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@82d84777b8317f9ad365cb8ceb4956a43d7fbd41
    with:
      service: none
      busbar_checkout: false
      macos_test: "cargo test --workspace --locked"
      extra_test: ""
      plugin_crate: busbar-transport-ws-plugin
      plugin_kind: transport
      plugin_alias: ws
    secrets: inherit
