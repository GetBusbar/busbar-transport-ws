# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-transport-ws"
version = "1.6.0"
publish = false            # a first-party plugin crate; shipped linked into busbar or as a signed tarball
edition = "2021"
rust-version = "1.97"
description = "The WebSocket transport: duplex message frames over an HTTP upgrade."
license = "Apache-2.0"

[lib]
name = "busbar_transport_ws"
path = "src/lib.rs"
# rlib: the LINKED door (`door::door`, which a busbar build names as a compiled-in row) and the
# tests. The dropped-in door is the sibling `busbar-transport-ws-plugin` cdylib, which exports this
# same door as its one symbol; this crate exports none.
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names. Pinned by git rev to the busbar commit in `.busbar-ref`; a
# busbar build that links this crate `[patch]`es the busbar git source to its own tree, so ONE copy
# of the contract links.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "82d84777b8317f9ad365cb8ceb4956a43d7fbd41" }
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures = "0.3"
# The door's settings blob is JSON (`door::read_settings`).
serde_json = "1"

[dev-dependencies]
# The TEST-ONLY seal: `busbar_contract::plugin::TestKernelSeal` is the one blessed fixture
# implementor of the SEALED `KernelSeal` trait the battery uses. Dev-only and feature-gated.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "82d84777b8317f9ad365cb8ceb4956a43d7fbd41", features = ["test-seal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util"] }
